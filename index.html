<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101713"><meta name="description" content="Sany's Business Margin toy store manager">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>Sany's Business Margin</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow" data-i18n="storeManager">TOY STORE MANAGER</div><h1>SANY'S <span>BUSINESS MARGIN</span></h1></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☼</button>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="home"><b>⌂</b><small data-i18n="home">Home</small></button>
      <button class="nav-item" data-tab="pos"><b>＋</b><small>POS</small></button>
      <button class="nav-item" data-tab="inventory"><b>▦</b><small data-i18n="inventory">Inventory</small></button>
      <button class="nav-item" data-tab="accounts"><b>৳</b><small data-i18n="accounts">Accounts</small></button>
      <button class="nav-item" data-tab="more"><b>•••</b><small data-i18n="more">More</small></button>
    </nav>
  </div>
  <dialog id="modal"><form method="dialog" id="modalForm"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" value="cancel">×</button></div><div id="modalBody"></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body></html>
